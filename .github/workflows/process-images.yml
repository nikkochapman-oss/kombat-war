name: Download and encode pending card images

on:
  push:
    branches:
      - monthly-update-*

jobs:
  process-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Process pending images
        if: hashFiles('PENDING_IMAGES.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const branch = context.ref.replace('refs/heads/', '');
            const pending = JSON.parse(fs.readFileSync('PENDING_IMAGES.json', 'utf8'));
            let assetsContent = fs.readFileSync('assets-mobile.js', 'utf8');
            let anyAdded = false;

            for (const entry of pending) {
              const { varName, url, cardName } = entry;
              console.log(`Downloading image for ${cardName}: ${url}`);
              try {
                const b64 = execSync(`curl -sL --max-time 30 -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" "${url}" | base64 -w 0`, { maxBuffer: 20 * 1024 * 1024 }).toString().trim();
                if (!b64 || b64.length < 100) {
                  console.log(`  SKIP: empty or too small for ${cardName}`);
                  continue;
                }
                const ext = url.split('.').pop().split('?')[0].toLowerCase();
                const mime = ext === 'png' ? 'image/png' : ext === 'webp' ? 'image/webp' : 'image/jpeg';
                assetsContent += `\nwindow.${varName} = "data:${mime};base64,${b64}";\n`;
                anyAdded = true;
                console.log(`  OK: ${varName} added (${Math.round(b64.length / 1024)}kb)`);
              } catch (e) {
                console.log(`  FAILED: ${cardName} — ${e.message}`);
              }
            }

            if (anyAdded) {
              fs.writeFileSync('assets-mobile.js', assetsContent);
            }

            fs.unlinkSync('PENDING_IMAGES.json');

            execSync('git config user.email "action@kombat-war.local"');
            execSync('git config user.name "Kombat-War Action"');
            execSync('git add assets-mobile.js');
            try {
              execSync('git rm --cached PENDING_IMAGES.json 2>/dev/null || true');
              execSync('git add -u');
              execSync('git commit -m "Process card images [skip ci]"');
              execSync(`git push origin ${branch}`);
            } catch (e) {
              console.log('Nothing to commit or push failed:', e.message);
            }

      - name: Create PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.KOMBAT_WAR_PAT }}
          script: |
            const { execSync } = require('child_process');
            const branch = context.ref.replace('refs/heads/', '');

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              let body = 'Auto-generated monthly card additions and critic feedback improvements. Review new cards, stats, and PATCH_NOTES.md before merging. After merge → Netlify auto-deploys.';
              try {
                body = execSync('tail -60 PATCH_NOTES.md').toString();
              } catch(e) {}

              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Monthly update - ${new Date().toLocaleString('en-US', { month: 'long', year: 'numeric' })}`,
                body,
                head: branch,
                base: 'main'
              });
              console.log('PR created');
            } else {
              console.log('PR already exists');
            }
