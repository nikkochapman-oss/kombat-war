name: Auto-create PR for agent branches

on:
  push:
    branches:
      - critic-feedback-*

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create Pull Request
        uses: actions/github-script@v7
        env:
          KOMBAT_WAR_PAT: ${{ secrets.KOMBAT_WAR_PAT }}
        with:
          script: |
            const branch = context.ref.replace('refs/heads/', '');
            const title = `Critic feedback - ${branch.replace('critic-feedback-', '')}`;
            const body = 'Monthly review from 4 sub-agent perspectives (WarHammer, Casual Cleo, Colonel Kovacs, UX Vera). **Merge to main before the 1st so the Game Updater can act on it.**';

            const { Octokit } = require('@octokit/rest');
            const patClient = new Octokit({ auth: process.env.KOMBAT_WAR_PAT });

            const { data: prs } = await patClient.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: 'open'
            });

            if (prs.length === 0) {
              await patClient.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                head: branch,
                base: 'main'
              });
              console.log(`PR created for branch: ${branch}`);
            } else {
              console.log(`PR already exists for branch: ${branch}`);
            }
